[project]
name = "multivariate-anomaly-detection"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pyreadr>=0.5.9",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "stumpy>=1.14.1",
    "threadpoolctl>=3.7.0",
    "tqdm>=4.70.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbformat>=5.11.1",
    "notebook>=7.6.4",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["anomaly_lab"]
testpaths = ["anomaly_lab/tests"]
