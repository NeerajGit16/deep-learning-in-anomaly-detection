[project]
name = "multivariate-anomaly-detection"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "h5py>=3.16.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pyreadr>=0.5.9",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "stumpy>=1.14.1",
    "threadpoolctl>=3.7.0",
    "tqdm>=4.70.1",
]

[project.optional-dependencies]
# The deep models (adlab/deep.py). "deep" is PyTorch built for NVIDIA GPUs (CUDA 13.0);
# "deep-cpu" is the same version without the GPU parts, much smaller, for CI. Pick one:
#   uv sync --extra deep        or        uv sync --extra deep-cpu
deep = ["torch>=2.14.1,<2.15"]
deep-cpu = ["torch>=2.14.1,<2.15"]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbformat>=5.11.1",
    "notebook>=7.6.4",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["anomaly_lab"]
testpaths = ["anomaly_lab/tests"]

[tool.uv]
conflicts = [[{ extra = "deep" }, { extra = "deep-cpu" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", extra = "deep" },
    { index = "pytorch-cpu", extra = "deep-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
